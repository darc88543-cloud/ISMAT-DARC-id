<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#04140b"/>
      <stop offset="50%" stop-color="#082215"/>
      <stop offset="100%" stop-color="#020b06"/>
    </linearGradient>
    <linearGradient id="aplexGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00C853"/>
      <stop offset="50%" stop-color="#00E676"/>
      <stop offset="100%" stop-color="#00F5D4"/>
    </linearGradient>
    <linearGradient id="glowGrad" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#00F5D4" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#00E676" stop-opacity="0.2"/>
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0f3824"/>
      <stop offset="100%" stop-color="#071b11"/>
    </linearGradient>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="subtleDrop" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  
  <!-- Outer subtle border ring -->
  <rect x="16" y="16" width="480" height="480" rx="96" fill="none" stroke="#00e676" stroke-opacity="0.2" stroke-width="3"/>

  <!-- Background Shield Crest -->
  <path d="M 256 68 
           L 396 128 
           L 396 270 
           C 396 360, 256 430, 256 430 
           C 256 430, 116 360, 116 270 
           L 116 128 Z" 
        fill="url(#shieldGrad)" 
        stroke="#1a4d33" 
        stroke-width="4" 
        filter="url(#subtleDrop)"/>

  <!-- Inner Ambient Neon Glow -->
  <circle cx="256" cy="245" r="110" fill="#00e676" opacity="0.12" filter="url(#neonGlow)"/>

  <!-- Stylized "A" Apex Monogram (Main Emblem) -->
  <g filter="url(#neonGlow)">
    <!-- Left Wing of A -->
    <path d="M 256 124 
             L 168 338 
             L 214 338 
             L 238 278 
             L 274 278 
             L 256 226 Z" 
          fill="url(#aplexGrad)"/>
          
    <!-- Right Wing of A (Elevated Dynamic Chevron) -->
    <path d="M 256 124 
             L 344 338 
             L 298 338 
             L 274 278 
             L 238 278 
             L 256 226 Z" 
          fill="url(#aplexGrad)" 
          opacity="0.92"/>

    <!-- Sharp Apex Center Diamond / Velocity Spark -->
    <polygon points="256,155 276,206 256,222 236,206" fill="#ffffff" opacity="0.95"/>

    <!-- Crossbar Tech Blade -->
    <polygon points="210,300 302,300 292,320 220,320" fill="url(#glowGrad)"/>
    
    <!-- Dynamic Speed Chevrons underneath -->
    <path d="M 226 358 L 256 376 L 286 358" fill="none" stroke="#00F5D4" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Brand Wordmark APLEX at Bottom -->
  <text x="256" y="474" 
        font-family="-apple-system, BlinkMacSystemFont, 'Plus Jakarta Sans', 'Segoe UI', Roboto, sans-serif" 
        font-size="36" 
        font-weight="900" 
        letter-spacing="10" 
        fill="#ffffff" 
        text-anchor="middle">
    APLEX
  </text>
</svg>
